<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Performance</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap">
<script>
  (function () { try { var q = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = q || localStorage.getItem('triage.theme') || 'system'; } catch (e) {} })();
</script>
<style>
  :root {
    --bg:#e7eddf; --panel:#f4f7ef; --fg:#11361f; --muted:#3c6449; --faint:#5f7f69; --line:#cad8c5; --line2:#93ae98; --soft:#dfe8d9;
    --accent:#0b5a2c; --ok:#1b6834; --bad:#a3301c; --warn:#7a4f06; --on:#f4f7ef;
    --glow:none; --glowbox:none;
    --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; --sans:var(--mono); --disp:"VT323", var(--mono);
    --paper:repeating-linear-gradient(180deg, transparent 0 30px, rgba(27,104,52,.06) 30px 60px);
    --scan:none; color-scheme:light;
  }
  :root[data-theme=dark] {
    --bg:#050b07; --panel:#09150e; --fg:#b4ffca; --muted:#86d9a2; --faint:#62ad7e; --line:#173f28; --line2:#2a6a44; --soft:#0f2116;
    --accent:#d4ffe1; --ok:#8dffb0; --bad:#ff6b57; --warn:#ffbf5e; --on:#030805;
    --glow:0 0 3px rgba(140,255,180,.22); --glowbox:0 0 22px rgba(120,255,165,.14);
    --paper:none; --scan:repeating-linear-gradient(180deg, rgba(0,0,0,.12) 0 1px, transparent 1px 4px), radial-gradient(ellipse at center, transparent 65%, rgba(0,0,0,.3));
    color-scheme:dark;
  }
  @media (prefers-color-scheme: dark) { :root[data-theme=system] {
    --bg:#050b07; --panel:#09150e; --fg:#b4ffca; --muted:#86d9a2; --faint:#62ad7e; --line:#173f28; --line2:#2a6a44; --soft:#0f2116;
    --accent:#d4ffe1; --ok:#8dffb0; --bad:#ff6b57; --warn:#ffbf5e; --on:#030805;
    --glow:0 0 3px rgba(140,255,180,.22); --glowbox:0 0 22px rgba(120,255,165,.14);
    --paper:none; --scan:repeating-linear-gradient(180deg, rgba(0,0,0,.12) 0 1px, transparent 1px 4px), radial-gradient(ellipse at center, transparent 65%, rgba(0,0,0,.3));
    color-scheme:dark;
  } }
  * { box-sizing:border-box }
  html, body { margin:0 }
  body { font:14px/1.6 var(--mono); background:var(--paper), var(--bg); background-attachment:fixed; color:var(--fg); text-shadow:var(--glow); -webkit-font-smoothing:antialiased }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:50; background:var(--scan) }
  ::selection { background:var(--fg); color:var(--on); text-shadow:none }
  a { color:var(--accent); text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px }
  a:hover { background:var(--fg); color:var(--on); text-decoration:none; text-shadow:none }
  code, kbd, pre { font-family:var(--mono) }
  @keyframes blink { 50% { opacity:0 } }
  @keyframes toast-in { from { opacity:0; transform:translate(-50%, 6px) } }
  header.top { position:sticky; top:0; z-index:5; height:60px; display:flex; align-items:center; gap:20px; padding:0 20px; background:var(--bg); border-bottom:1px solid var(--line2) }
  .brand { display:flex; align-items:center; gap:12px }
  .brand h1 { font:400 28px/1 var(--disp); letter-spacing:.08em; text-transform:uppercase; margin:0; white-space:nowrap }
  .mark { width:12px; height:12px; background:var(--fg); box-shadow:var(--glow) }
  .seg { display:inline-flex; border:1px solid var(--line2) }
  .seg button, .seg a { border:0; border-right:1px solid var(--line2); background:none; color:var(--muted); font:500 11.5px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; padding:9px 12px; cursor:pointer; text-decoration:none; text-shadow:inherit }
  .seg > :last-child { border-right:0 }
  .seg button:hover, .seg a:hover { color:var(--fg); background:var(--soft) }
  .seg button.on, .seg a.on { background:var(--fg); color:var(--on); text-shadow:none }
  .seg.sm button { padding:7px 9px; font-size:11px }
  .spacer { flex:1 }
  .stats { color:var(--muted); font-size:12px; letter-spacing:.06em; text-transform:uppercase; font-variant-numeric:tabular-nums; white-space:nowrap }
  .stats b { color:var(--fg); font-weight:600 }
  .approver { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase }
  .signout { border:1px solid var(--line2); background:none; color:var(--muted); font:500 11px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; padding:8px 10px; cursor:pointer }
  .signout:hover { color:var(--fg); border-color:var(--fg) }
  input, textarea, select { font:inherit; color:var(--fg); background:var(--panel); border:1px solid var(--line2); border-radius:0; padding:6px 10px; outline:none; caret-color:var(--fg); text-shadow:inherit }
  input::placeholder, textarea::placeholder { color:var(--faint) }
  input:focus, textarea:focus, select:focus { border-color:var(--fg); box-shadow:0 0 0 1px var(--fg), var(--glowbox) }
  #approver { width:150px; text-transform:none; letter-spacing:0 }
  main { display:grid; grid-template-columns:280px minmax(0,1fr) }
  aside { position:sticky; top:60px; height:calc(100vh - 60px); overflow:auto; padding:16px 12px; border-right:1px solid var(--line2); display:flex; flex-direction:column; gap:1px }
  .rail-head { display:flex; justify-content:space-between; padding:0 10px 8px; font:400 19px/1 var(--disp); letter-spacing:.1em; text-transform:uppercase; color:var(--faint) }
  .cat { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; padding:6px 10px; border-left:2px solid transparent; cursor:pointer; font-size:13px }
  .cat span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .cat:hover { background:var(--soft) }
  .cat.on { background:var(--soft); border-left-color:var(--fg); font-weight:600 }
  .count { font:600 12px/1 var(--mono); font-variant-numeric:tabular-nums; color:var(--fg) }
  .count::before { content:"[" ; color:var(--faint) } .count::after { content:"]"; color:var(--faint) }
  .count.zero { color:var(--faint); font-weight:400 }
  .keys { margin-top:auto; padding:20px 10px 4px; color:var(--faint); font-size:11px; letter-spacing:.06em; text-transform:uppercase; display:flex; flex-wrap:wrap; gap:6px 14px }
  kbd { display:inline-block; min-width:18px; text-align:center; font-size:11px; line-height:16px; padding:0 4px; border:1px solid var(--line2); color:var(--muted); background:none; text-transform:none }
  #view { padding:28px 36px 96px; width:100%; min-width:0 }
  .cat-block { margin-bottom:48px }
  .cat-title { display:flex; align-items:baseline; gap:14px; margin:0 0 22px; padding-bottom:10px; border-bottom:1px solid var(--line2) }
  .cat-title h2 { font:400 36px/1 var(--disp); letter-spacing:.06em; text-transform:uppercase; margin:0 }
  .cat-title code { font-size:12px; color:var(--faint) }
  .group { margin-bottom:32px }
  .group-head { display:flex; gap:20px; align-items:flex-start; justify-content:space-between; margin-bottom:12px }
  .group-head h3 { font-size:14.5px; font-weight:600; margin:0 0 4px; text-wrap:pretty }
  .group-head p { margin:0; color:var(--muted); font-size:13px; text-wrap:pretty; max-width:80ch }
  .group-head .btn { flex:none }
  .path { display:inline-block; margin-top:8px; font:12px/1.4 var(--mono); color:var(--muted); border:1px dashed var(--line2); padding:2px 7px; word-break:break-all }
  .group-body, .list { display:flex; flex-direction:column; gap:12px }
  .group-body { padding-left:16px; border-left:1px solid var(--line2) }
  .card { position:relative; background:var(--panel); border:1px solid var(--line2); padding:14px 16px; transition:border-color .15s, box-shadow .15s }
  .card::before, .card::after { content:""; position:absolute; width:9px; height:9px; pointer-events:none }
  .card::before { top:-1px; left:-1px; border-top:2px solid var(--fg); border-left:2px solid var(--fg) }
  .card::after { bottom:-1px; right:-1px; border-bottom:2px solid var(--fg); border-right:2px solid var(--fg) }
  .card.focus { border-color:var(--fg); box-shadow:0 0 0 1px var(--fg), var(--glowbox) }
  .meta-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums }
  .meta-row .id { color:var(--fg); font-weight:600 }
  .tag { padding:0 6px; border:1px solid var(--line2); color:var(--muted); font-size:11.5px }
  .tag.dc { border-color:var(--accent); color:var(--accent) }
  .target { font-weight:600; margin-top:8px; color:var(--accent) }
  .sugg { margin-top:2px; text-wrap:pretty }
  details { margin-top:8px }
  summary { cursor:pointer; color:var(--muted); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; list-style:none; display:inline-flex; align-items:center; gap:6px }
  summary::-webkit-details-marker { display:none }
  summary::before { content:"[+]"; color:var(--faint) }
  details[open] > summary::before { content:"[\2212]" }
  summary:hover { color:var(--fg) }
  .detail { margin-top:8px; padding:10px 12px; background:var(--soft); border-left:2px solid var(--line2); font-size:13px } .detail p { margin:0 0 6px } .detail p:last-child { margin:0 }
  .rec-row { display:flex; gap:10px; align-items:flex-start; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line2) }
  .rec-row p { margin:0; font-size:13px; text-wrap:pretty }
  .rec, .pill { flex:none; font:600 10.5px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; padding:4px 6px; border:1px solid currentColor; background:none; color:var(--muted); white-space:nowrap }
  .rec { margin-top:1px }
  .rec.approve { color:var(--ok) } .rec.reject { color:var(--bad) } .rec.defer { color:var(--warn) } .rec.supersede { color:var(--faint) }
  .pill.approved, .pill.applied, .pill.accepted, .pill.finished, .pill.done, .pill.complete { color:var(--ok) }
  .pill.rejected, .pill.declined, .pill.failed, .pill.blocked { color:var(--bad) }
  .pill.running, .pill.proposed, .pill.pending, .pill.in-progress { color:var(--accent) }
  .pill.not-started, .pill.retired, .pill.superseded { color:var(--faint) }
  pre { font-size:12px; line-height:1.5; background:var(--soft); border-left:2px solid var(--line2); padding:10px 12px; white-space:pre-wrap; max-height:280px; overflow:auto; margin:8px 0 }
  .status { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; font-size:12px; color:var(--muted) }
  .btns { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:14px }
  .btns .sep { width:1px; height:18px; background:var(--line2); margin:0 4px }
  .btn, .btns button { display:inline-flex; align-items:center; gap:8px; font:500 11.5px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; padding:8px 12px; border:1px solid var(--line2); border-radius:0; background:none; color:var(--fg); cursor:pointer; white-space:nowrap; text-shadow:inherit }
  .btn:hover, .btns button:hover { background:var(--soft); border-color:var(--fg) }
  .btn.ok, .btns button.ok { background:var(--ok); border-color:var(--ok); color:var(--on); text-shadow:none }
  .btn.ok:hover, .btns button.ok:hover { background:var(--ok); filter:brightness(1.1); box-shadow:var(--glowbox) }
  .btns button.bad { color:var(--bad); border-color:var(--bad) }
  .btns button.bad:hover { background:var(--bad); color:var(--on); text-shadow:none }
  .btn kbd, .btns button kbd { border-color:currentColor; color:inherit; opacity:.6; line-height:14px }
  .btn.sm { padding:6px 9px; font-size:11px }
  .empty { padding:64px 0; font:400 26px/1.25 var(--disp); letter-spacing:.04em; color:var(--muted); text-align:center; text-wrap:pretty }
  .empty::before { content:"> " }
  .empty::after { content:"\2588"; margin-left:4px; font-size:.75em; animation:blink 1.1s steps(1) infinite }
  .empty code, .status code, .none code { background:var(--soft); padding:1px 6px; font:13px var(--mono) }
  .filter { display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap; color:var(--muted); font-size:12px; letter-spacing:.06em; text-transform:uppercase }
  .table-wrap { background:var(--panel); border:1px solid var(--line2); overflow:auto }
  table { border-collapse:collapse; width:100%; font-size:12.5px; font-variant-numeric:tabular-nums }
  th { text-align:left; font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--faint); padding:10px 14px; border-bottom:1px solid var(--line2); white-space:nowrap }
  td { padding:9px 14px; border-bottom:1px solid var(--line); vertical-align:top }
  tr:last-child td { border-bottom:0 }
  th.num, td.num { text-align:right }
  td.mono { font-size:12px; white-space:nowrap }
  .sub { margin:36px 0 12px; font:400 22px/1 var(--disp); letter-spacing:.1em; text-transform:uppercase; color:var(--faint) }
  .fields { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px 14px; margin-top:14px }
  .field.full { grid-column:1 / -1 }
  .field label { display:block; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; font-weight:500 }
  .field input, .field textarea { width:100% }
  .len-row { display:flex; align-items:center; gap:12px; margin-top:14px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums }
  .lenbar, .bar { height:8px; border:1px solid var(--line2); padding:1px; background:none; overflow:hidden }
  .lenbar { width:180px }
  .lenbar i, .bar i { display:block; height:100%; background:repeating-linear-gradient(90deg, var(--ok) 0 5px, transparent 5px 7px); transition:width .15s }
  .len-row.warn .lenbar i { background:repeating-linear-gradient(90deg, var(--warn) 0 5px, transparent 5px 7px) }
  .len-row.over .lenbar i { background:repeating-linear-gradient(90deg, var(--bad) 0 5px, transparent 5px 7px) }
  .len-row.over b { color:var(--bad) }
  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:60; background:var(--bg); color:var(--fg); border:1px solid var(--fg); padding:10px 16px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; box-shadow:var(--glowbox); animation:toast-in .18s ease-out }
  .toast::before { content:"> " }
  .filters { display:flex; flex-direction:column; gap:8px; padding:0 2px 6px }
  .filters .row { display:flex; gap:8px } .filters .row > * { flex:1; min-width:0 }
  #q { width:100% }
  .mlist { display:flex; flex-direction:column; gap:1px }
  .mrow { padding:9px 10px; border-left:2px solid transparent; cursor:pointer; display:flex; flex-direction:column; gap:3px; text-decoration:none; color:inherit }
  .mrow:hover { background:var(--soft); color:inherit; text-shadow:inherit }
  .mrow.on { background:var(--soft); border-left-color:var(--fg) }
  .mrow .t { font-size:13px; font-weight:500; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-wrap:pretty }
  .mrow .m { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums }
  .mrow .id { font-size:11px; color:var(--faint); letter-spacing:.06em }
  .head { margin-bottom:24px }
  .head .ids { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:12px; color:var(--muted) }
  .head .ids .id { color:var(--fg); font-weight:600 }
  .head h2 { font:400 40px/1.02 var(--disp); letter-spacing:.04em; text-transform:uppercase; margin:10px 0 8px; text-wrap:balance; max-width:44ch }
  .head .when { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin:0 0 32px }
  .tile { position:relative; background:var(--panel); border:1px solid var(--line2); padding:12px 14px }
  .tile .k { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--faint) }
  .tile .v { font:400 40px/1 var(--disp); font-variant-numeric:tabular-nums; margin-top:4px }
  .tile .s { font-size:11.5px; color:var(--muted) }
  .bar { margin-top:8px }
  section.sec { margin-bottom:36px }
  .sec > h3 { display:flex; align-items:center; gap:12px; font:400 22px/1 var(--disp); letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin:0 0 12px }
  .sec > h3::after { content:""; flex:1; height:1px; background:var(--line2) }
  .sec > h3 .n { color:var(--fg); font-variant-numeric:tabular-nums }
  .goal code, .crit code { background:var(--soft); padding:1px 5px; font-size:.9em }
  .goal { font-size:14.5px; text-wrap:pretty; margin:0 0 12px; max-width:80ch }
  .crit { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px }
  .crit li { display:grid; grid-template-columns:20px minmax(0,1fr); gap:8px; font-size:13px; text-wrap:pretty }
  .crit .box { width:15px; height:15px; margin-top:2px; border:1px solid var(--line2); display:grid; place-items:center; font-size:10px; font-weight:700; line-height:1 }
  .crit .box.yes { background:var(--ok); border-color:var(--ok); color:var(--on); text-shadow:none }
  .crit .box.no { border-color:var(--bad); color:var(--bad) }
  .crit .ev { display:block; color:var(--muted); font-size:12px }
  .steps { display:flex; flex-direction:column }
  .step { display:grid; grid-template-columns:40px minmax(0,1fr); gap:0 14px; position:relative }
  .step .rail { display:flex; flex-direction:column; align-items:center }
  .step .dot { width:30px; height:30px; flex:none; display:grid; place-items:center; font:600 12px/1 var(--mono); background:var(--soft); color:var(--muted); border:1px solid var(--line2) }
  .step .dot.done { background:var(--ok); border-color:var(--ok); color:var(--on); text-shadow:none }
  .step .dot.failed { background:var(--bad); border-color:var(--bad); color:var(--on); text-shadow:none }
  .step .dot.in-progress { border-color:var(--fg); color:var(--fg); animation:blink 1.4s steps(1) infinite }
  .step .line { flex:1; width:1px; background:var(--line2); margin:2px 0 }
  .step:last-child .line { display:none }
  .step .body { padding:4px 0 20px; min-width:0 }
  .step .top { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums }
  .step .agent { font-weight:600; color:var(--fg); font-size:13px }
  .step .sum { margin-top:3px; text-wrap:pretty; max-width:90ch }
  .open { font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; margin-left:auto }
  .ev { margin:6px 0 0; padding:0; list-style:none; font-size:12px; color:var(--muted) }
  .ev li { padding:3px 0; border-top:1px solid var(--line) } .ev li:first-child { border-top:0 }
  .ev .ts { font-size:11px; color:var(--faint); margin-right:8px }
  .md { font-size:13px; line-height:1.6; text-wrap:pretty; overflow-wrap:anywhere }
  .md h1 { font:400 28px/1.1 var(--disp); letter-spacing:.05em; text-transform:uppercase; margin:0 0 12px }
  .md h2 { font:400 22px/1.1 var(--disp); letter-spacing:.06em; text-transform:uppercase; margin:22px 0 8px }
  .md h3, .md h4 { font-size:13px; margin:16px 0 6px }
  .md p { margin:0 0 10px } .md ul, .md ol { margin:0 0 10px; padding-left:22px } .md li { margin:2px 0 }
  .md code { background:var(--soft); padding:1px 5px; font-size:12px }
  .md pre { background:var(--soft); padding:10px 12px; overflow:auto; font-size:12px }
  .md .tw { overflow:auto; margin:0 0 12px }
  .two { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px }
  .crew-card b { display:block } .crew-card span { color:var(--muted); font-size:12.5px }
  .none { color:var(--faint); font-size:12.5px }
  .grade { display:inline-grid; place-items:center; min-width:22px; height:22px; padding:0 4px; font:400 20px/1 var(--disp); border:1px solid currentColor; color:var(--muted); text-shadow:inherit }
  .grade.lg { min-width:46px; height:46px; font-size:44px }
  .grade.gA, .grade.gB { color:var(--ok) } .grade.gC { color:var(--accent) } .grade.gD { color:var(--warn) } .grade.gE, .grade.gF { color:var(--bad) }
  .grade.solid.gA, .grade.solid.gB { background:var(--ok); border-color:var(--ok); color:var(--on); text-shadow:none }
  .grade.solid.gC { background:var(--accent); border-color:var(--accent); color:var(--on); text-shadow:none }
  .grade.solid.gD { background:var(--warn); border-color:var(--warn); color:var(--on); text-shadow:none }
  .grade.solid.gE, .grade.solid.gF { background:var(--bad); border-color:var(--bad); color:var(--on); text-shadow:none }
  .verdict { display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; align-items:start }
  .verdict h4 { margin:12px 0 4px; font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--faint) }
  .verdict p { margin:0; text-wrap:pretty; max-width:90ch }
  .signals { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px }
  @media (max-width: 1100px) { .stats { display:none } .two { grid-template-columns:1fr } }
  @media (max-width: 860px) {
    header.top { height:auto; flex-wrap:wrap; padding:10px 16px; gap:10px 14px }
    main { grid-template-columns:1fr }
    aside { position:static; height:auto; max-height:46vh; border-right:0; border-bottom:1px solid var(--line2) }
    #view { padding:20px 16px 80px }
    .fields { grid-template-columns:1fr }
    .group-head { flex-direction:column }
    .head h2 { font-size:32px }
  }
  @media (prefers-reduced-motion: reduce) { .empty::after, .step .dot.in-progress { animation:none } }
  .hgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:12px; margin:0 0 36px }
  .hcard { display:flex; flex-direction:column; gap:10px }
  .hcard .top { display:flex; align-items:center; gap:14px }
  .hcard .name { font:400 24px/1 var(--disp); letter-spacing:.06em; text-transform:uppercase; overflow-wrap:anywhere }
  .hcard .sub2 { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums }
  .dist { display:flex; height:14px; border:1px solid var(--line2); padding:1px; gap:1px }
  .dist i { display:block; height:100% }
  .dist .dA, .dist .dB { background:var(--ok) } .dist .dB { opacity:.65 } .dist .dC { background:var(--accent); opacity:.55 }
  .dist .dD { background:var(--warn) } .dist .dE { background:var(--bad); opacity:.65 } .dist .dF { background:var(--bad) }
  .legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums }
  .recent { display:flex; flex-wrap:wrap; gap:4px }
  .recent a { text-decoration:none } .recent a:hover { background:none }
  .rowfilters { display:flex; gap:10px; flex-wrap:wrap; margin:0 0 14px }
  .rowfilters select { min-width:160px }
  td .sugg { margin:0 }
  main.single { display:block }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"></span><h1>Harness Performance</h1></div>
  <nav class="seg" aria-label="Pages"><a href="/triage">Triage</a><a href="/missions">Missions</a><a href="/performance" class="on">Performance</a></nav>
  <span class="spacer"></span>
  <span id="stats" class="stats"></span>
  <button id="signout" class="signout" hidden title="Forget the API key stored in this browser">Forget key</button>
  <div class="seg sm" id="theme" title="Theme">
    <button data-set="system">Auto</button>
    <button data-set="light">Light</button>
    <button data-set="dark">Dark</button>
  </div>
</header>
<main class="single">
  <section id="view"><div class="empty">Loading…</div></section>
</main>
<script>
(() => {
  const $ = (s, el=document) => el.querySelector(s);
  const state = { perf:null, grades:[], filters:{ harness:'', grade:'' } };
  try { Object.assign(state.filters, JSON.parse(localStorage.getItem('perf.filters') || '{}')); } catch (e) {}

  const root = document.documentElement;
  const paintTheme = () => $('#theme').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.set === root.dataset.theme));
  $('#theme').querySelectorAll('button').forEach(b => b.onclick = () => { root.dataset.theme = b.dataset.set; try { localStorage.setItem('triage.theme', b.dataset.set); } catch (e) {} paintTheme(); });
  paintTheme();

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // API key (docs/plans/NETWORK-DEPLOYMENT-PLAN.md §3.1): asked for when the
  // service answers 401, kept in this browser, sent on every /v1 call.
  const KEY_STORE = 'bishop.apiKey';
  const getKey = () => { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } };
  const setKey = k => { try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch (e) {} paintSignOut(); };
  const paintSignOut = () => { const b = document.getElementById('signout'); if (b) b.hidden = !getKey(); };
  document.getElementById('signout').onclick = () => { setKey(''); location.reload(); };
  paintSignOut();
  const authed = async (path, opts = {}) => {
    const send = () => fetch(path, { ...opts, headers: { ...(opts.headers || {}), ...(getKey() ? { Authorization: 'Bearer ' + getKey() } : {}) } });
    let r = await send();
    if (r.status === 401) {
      const k = prompt('This bishop-memory needs an API key.\nPaste the key you were given (memoryd keys add <name>):');
      if (k && k.trim()) { setKey(k.trim()); r = await send(); }
    }
    return r;
  };
  const api = async path => {
    const r = await authed(path); const text = await r.text(); let json = {}; try { json = text ? JSON.parse(text) : {}; } catch (e) {}
    if (!r.ok) throw new Error(json.error || r.status); return json;
  };
  const toDate = s => { if (!s) return null; const d = new Date(String(s).replace(' ', 'T') + (/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? '' : 'Z')); return isNaN(d) ? null : d; };
  const fmtDay = s => { const d = toDate(s); return d ? d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }) : ''; };
  const LETTERS = ['A','B','C','D','E','F'];
  const gradeBadge = (g, cls = '') => `<span class="grade g${esc(g)} ${cls}" title="Mission grade ${esc(g)}">${esc(g)}</span>`;
  const tile = (k, v, s) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;

  // Distribution bar: one segment per letter, width by share of graded missions.
  const dist = h => {
    if (!h.graded) return '<div class="none">No grades yet.</div>';
    const seg = LETTERS.filter(l => h.distribution[l]).map(l => `<i class="d${l}" style="width:${(h.distribution[l] / h.graded * 100).toFixed(1)}%" title="${l}: ${h.distribution[l]}"></i>`).join('');
    const legend = LETTERS.map(l => `<span>${l} ${h.distribution[l] || 0}</span>`).join('');
    return `<div class="dist">${seg}</div><div class="legend">${legend}</div>`;
  };
  // Trend: the average of the five newest grades against the five before them.
  const trend = h => {
    const pts = { A:5, B:4, C:3, D:2, E:1, F:0 };
    const r = h.recent.map(x => pts[x.grade]);
    if (r.length < 6) return '';
    const a = r.slice(0, 5), b = r.slice(5);
    const avg = xs => xs.reduce((n, x) => n + x, 0) / xs.length;
    const delta = avg(a) - avg(b);
    if (Math.abs(delta) < 0.3) return '<span class="tag">steady</span>';
    return delta > 0 ? '<span class="tag" style="color:var(--ok);border-color:var(--ok)">improving</span>' : '<span class="tag" style="color:var(--bad);border-color:var(--bad)">slipping</span>';
  };

  function harnessCard(h) {
    const name = h.harness || 'no harness';
    return `<div class="card hcard">
      <div class="top">${h.avg_grade ? gradeBadge(h.avg_grade, 'lg solid') : '<span class="grade lg">—</span>'}
        <div><div class="name">${esc(name)}</div>
          <div class="sub2">${h.graded} graded${h.avg_points != null ? ` · ${Number(h.avg_points).toFixed(2)}&nbsp;/&nbsp;5` : ''}${h.waiting ? ` · ${h.waiting} waiting` : ''}${h.insufficient ? ` · ${h.insufficient} not enough evidence` : ''}${h.skipped ? ` · ${h.skipped} skipped` : ''}</div></div>
        <span class="spacer"></span>${trend(h)}</div>
      ${dist(h)}
      ${h.recent.length ? `<div><div class="sub2" style="margin-bottom:4px">Latest, newest first</div><div class="recent">${h.recent.map(x => `<a href="/missions#${encodeURIComponent(x.mission_id)}" title="${esc(x.mission_id)} · ${esc(x.title)}">${gradeBadge(x.grade)}</a>`).join('')}</div></div>` : ''}
    </div>`;
  }

  function render() {
    const p = state.perf, o = p.overall;
    const f = state.filters;
    const grades = state.grades.filter(g => (!f.harness || (g.harness || '') === f.harness) && (!f.grade || g.grade === f.grade || (f.grade === 'insufficient' && g.state === 'insufficient')));
    const harnessNames = p.harnesses.map(h => h.harness);
    $('#stats').innerHTML = `<b>${o.graded}</b> graded · average <b>${o.avg_grade || '—'}</b>${o.waiting ? ` · <b>${o.waiting}</b> waiting` : ''}`;
    $('#view').innerHTML = `
      <div class="tiles">
        ${tile('Average grade', o.avg_grade ? gradeBadge(o.avg_grade, 'lg solid') : '—', o.avg_points != null ? `${Number(o.avg_points).toFixed(2)} of 5 over every harness` : 'nothing graded yet')}
        ${tile('Graded', o.graded, 'finished missions with a grade')}
        ${tile('Waiting', o.waiting, o.waiting ? 'graded by the next run, 10 at a time' : 'every finished mission has a verdict')}
        ${tile('Set aside', o.insufficient + o.skipped, `${o.insufficient} not enough evidence · ${o.skipped} skipped`)}
      </div>
      <section class="sec"><h3>Harnesses <span class="n">${p.harnesses.length}</span></h3>
        ${p.harnesses.length ? `<div class="hgrid">${p.harnesses.map(harnessCard).join('')}</div>` : '<div class="none">No finished missions yet.</div>'}</section>
      <section class="sec"><h3>Grades <span class="n">${grades.length}</span></h3>
        <div class="rowfilters">
          <select id="fh"><option value="">All harnesses</option>${harnessNames.map(n => `<option value="${esc(n)}">${esc(n || 'no harness')}</option>`).join('')}</select>
          <select id="fg"><option value="">Any grade</option>${LETTERS.map(l => `<option>${l}</option>`).join('')}<option value="insufficient">Not enough evidence</option></select>
        </div>
        ${grades.length ? `<div class="table-wrap"><table><tr><th>Grade</th><th>Mission</th><th>Harness</th><th>Closed</th><th>Why, and what to change</th></tr>${grades.map(g => `<tr>
          <td>${g.grade ? gradeBadge(g.grade) : '<span class="tag">n/e</span>'}</td>
          <td class="mono"><a href="/missions#${encodeURIComponent(g.mission_id)}">${esc(g.mission_id)}</a><div class="sub2" style="white-space:normal">${esc(g.title)}</div></td>
          <td>${esc(g.harness || '—')}</td>
          <td class="mono">${esc(fmtDay(g.closed_at))}</td>
          <td><p class="sugg">${esc(g.summary)}</p>${g.suggestions ? `<details><summary>Suggestions</summary><div class="detail">${esc(g.suggestions)}</div></details>` : ''}</td>
        </tr>`).join('')}</table></div>` : '<div class="none">No grades match.</div>'}
      </section>`;
    $('#fh').value = f.harness; $('#fg').value = f.grade;
    const save = () => { try { localStorage.setItem('perf.filters', JSON.stringify(state.filters)); } catch (e) {} };
    $('#fh').onchange = e => { state.filters.harness = e.target.value; save(); render(); };
    $('#fg').onchange = e => { state.filters.grade = e.target.value; save(); render(); };
  }

  Promise.all([api('/v1/mission-grades/performance'), api('/v1/mission-grades?limit=500')])
    .then(([perf, list]) => { state.perf = perf; state.grades = list.grades; render(); })
    .catch(e => { $('#view').innerHTML = `<div class="empty">Cannot reach the service: ${esc(e.message)}</div>`; });
})();
</script>
</body>
</html>
