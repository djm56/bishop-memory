<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Crew</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap">
<script>
  (function () { try { var q = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = q || localStorage.getItem('triage.theme') || 'system'; } catch (e) {} })();
</script>
<style>
  :root {
    --bg:#e7eddf; --panel:#f4f7ef; --fg:#11361f; --muted:#3c6449; --faint:#5f7f69; --line:#cad8c5; --line2:#93ae98; --soft:#dfe8d9;
    --accent:#0b5a2c; --ok:#1b6834; --bad:#a3301c; --warn:#7a4f06; --on:#f4f7ef;
    --glow:none; --glowbox:none;
    --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; --sans:var(--mono); --disp:"VT323", var(--mono);
    --paper:repeating-linear-gradient(180deg, transparent 0 30px, rgba(27,104,52,.06) 30px 60px);
    --scan:none; color-scheme:light;
  }
  :root[data-theme=dark] {
    --bg:#050b07; --panel:#09150e; --fg:#b4ffca; --muted:#86d9a2; --faint:#62ad7e; --line:#173f28; --line2:#2a6a44; --soft:#0f2116;
    --accent:#d4ffe1; --ok:#8dffb0; --bad:#ff6b57; --warn:#ffbf5e; --on:#030805;
    --glow:0 0 3px rgba(140,255,180,.22); --glowbox:0 0 22px rgba(120,255,165,.14);
    --paper:none; --scan:repeating-linear-gradient(180deg, rgba(0,0,0,.12) 0 1px, transparent 1px 4px), radial-gradient(ellipse at center, transparent 65%, rgba(0,0,0,.3));
    color-scheme:dark;
  }
  @media (prefers-color-scheme: dark) { :root[data-theme=system] {
    --bg:#050b07; --panel:#09150e; --fg:#b4ffca; --muted:#86d9a2; --faint:#62ad7e; --line:#173f28; --line2:#2a6a44; --soft:#0f2116;
    --accent:#d4ffe1; --ok:#8dffb0; --bad:#ff6b57; --warn:#ffbf5e; --on:#030805;
    --glow:0 0 3px rgba(140,255,180,.22); --glowbox:0 0 22px rgba(120,255,165,.14);
    --paper:none; --scan:repeating-linear-gradient(180deg, rgba(0,0,0,.12) 0 1px, transparent 1px 4px), radial-gradient(ellipse at center, transparent 65%, rgba(0,0,0,.3));
    color-scheme:dark;
  } }
  * { box-sizing:border-box }
  html, body { margin:0 }
  body { font:14px/1.6 var(--mono); background:var(--paper), var(--bg); background-attachment:fixed; color:var(--fg); text-shadow:var(--glow); -webkit-font-smoothing:antialiased }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:50; background:var(--scan) }
  ::selection { background:var(--fg); color:var(--on); text-shadow:none }
  a { color:var(--accent); text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px }
  a:hover { background:var(--fg); color:var(--on); text-decoration:none; text-shadow:none }
  code, kbd, pre { font-family:var(--mono) }
  @keyframes blink { 50% { opacity:0 } }
  @keyframes toast-in { from { opacity:0; transform:translate(-50%, 6px) } }
  header.top { position:sticky; top:0; z-index:5; height:60px; display:flex; align-items:center; gap:20px; padding:0 20px; background:var(--bg); border-bottom:1px solid var(--line2) }
  .brand { display:flex; align-items:center; gap:12px }
  .brand h1 { font:400 28px/1 var(--disp); letter-spacing:.08em; text-transform:uppercase; margin:0; white-space:nowrap }
  .mark { width:12px; height:12px; background:var(--fg); box-shadow:var(--glow) }
  .seg { display:inline-flex; border:1px solid var(--line2) }
  .seg button, .seg a { border:0; border-right:1px solid var(--line2); background:none; color:var(--muted); font:500 11.5px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; padding:9px 12px; cursor:pointer; text-decoration:none; text-shadow:inherit }
  .seg > :last-child { border-right:0 }
  .seg button:hover, .seg a:hover { color:var(--fg); background:var(--soft) }
  .seg button.on, .seg a.on { background:var(--fg); color:var(--on); text-shadow:none }
  .seg.sm button { padding:7px 9px; font-size:11px }
  .spacer { flex:1 }
  .stats { color:var(--muted); font-size:12px; letter-spacing:.06em; text-transform:uppercase; font-variant-numeric:tabular-nums; white-space:nowrap }
  .stats b { color:var(--fg); font-weight:600 }
  .signout { border:1px solid var(--line2); background:none; color:var(--muted); font:500 11px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; padding:8px 10px; cursor:pointer }
  .signout:hover { color:var(--fg); border-color:var(--fg) }
  input, textarea, select { font:inherit; color:var(--fg); background:var(--panel); border:1px solid var(--line2); border-radius:0; padding:6px 10px; outline:none; caret-color:var(--fg); text-shadow:inherit }
  input::placeholder, textarea::placeholder { color:var(--faint) }
  input:focus, textarea:focus, select:focus { border-color:var(--fg); box-shadow:0 0 0 1px var(--fg), var(--glowbox) }
  #approver { width:150px; text-transform:none; letter-spacing:0 }
  main { display:grid; grid-template-columns:280px minmax(0,1fr) }
  aside { position:sticky; top:60px; height:calc(100vh - 60px); overflow:auto; padding:16px 12px; border-right:1px solid var(--line2); display:flex; flex-direction:column; gap:1px }
  .rail-head { display:flex; justify-content:space-between; padding:0 10px 8px; font:400 19px/1 var(--disp); letter-spacing:.1em; text-transform:uppercase; color:var(--faint) }
  .cat { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; padding:6px 10px; border-left:2px solid transparent; cursor:pointer; font-size:13px }
  .cat span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .cat:hover { background:var(--soft) }
  .cat.on { background:var(--soft); border-left-color:var(--fg); font-weight:600 }
  .count { font:600 12px/1 var(--mono); font-variant-numeric:tabular-nums; color:var(--fg) }
  .count::before { content:"[" ; color:var(--faint) } .count::after { content:"]"; color:var(--faint) }
  .count.zero { color:var(--faint); font-weight:400 }
  .keys { margin-top:auto; padding:20px 10px 4px; color:var(--faint); font-size:11px; letter-spacing:.06em; text-transform:uppercase; display:flex; flex-wrap:wrap; gap:6px 14px }
  kbd { display:inline-block; min-width:18px; text-align:center; font-size:11px; line-height:16px; padding:0 4px; border:1px solid var(--line2); color:var(--muted); background:none; text-transform:none }
  #view { padding:28px 36px 96px; width:100%; min-width:0 }
  .empty { padding:64px 0; font:400 26px/1.25 var(--disp); letter-spacing:.04em; color:var(--muted); text-align:center; text-wrap:pretty }
  .empty::before { content:"> " }
  .empty::after { content:"\2588"; margin-left:4px; font-size:.75em; animation:blink 1.1s steps(1) infinite }
  .empty code, .status code, .none code { background:var(--soft); padding:1px 6px; font:13px var(--mono) }
  .card { position:relative; background:var(--panel); border:1px solid var(--line2); padding:14px 16px; transition:border-color .15s, box-shadow .15s }
  .card::before, .card::after { content:""; position:absolute; width:9px; height:9px; pointer-events:none }
  .card::before { top:-1px; left:-1px; border-top:2px solid var(--fg); border-left:2px solid var(--fg) }
  .card::after { bottom:-1px; right:-1px; border-bottom:2px solid var(--fg); border-right:2px solid var(--fg) }
  .card.focus { border-color:var(--fg); box-shadow:0 0 0 1px var(--fg), var(--glowbox) }
  .crew-list { display:flex; flex-direction:column; gap:12px }
  .crew-card { position:relative; background:var(--panel); border:1px solid var(--line2); padding:14px 16px; transition:border-color .15s, box-shadow .15s }
  .crew-card::before, .crew-card::after { content:""; position:absolute; width:9px; height:9px; pointer-events:none }
  .crew-card::before { top:-1px; left:-1px; border-top:2px solid var(--fg); border-left:2px solid var(--fg) }
  .crew-card::after { bottom:-1px; right:-1px; border-bottom:2px solid var(--fg); border-right:2px solid var(--fg) }
  .crew-card .name { font:400 22px/1 var(--disp); letter-spacing:.06em; text-transform:uppercase; margin:0 0 8px }
  .crew-card .role { font-size:11.5px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-bottom:10px }
  .crew-card .row { display:flex; gap:16px; margin-bottom:8px; font-size:13px; flex-wrap:wrap }
  .crew-card .row b { color:var(--fg); font-weight:600 }
  .crew-card .row span { color:var(--muted) }
  .crew-card .mistakes-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px; font-size:12px }
  .crew-card .mistake-badge { padding:2px 6px; border:1px solid var(--line2); color:var(--muted); display:inline-flex; gap:4px; align-items:center }
  .crew-card .mistake-list { margin-top:6px; padding-left:16px; border-left:1px solid var(--line2); font-size:12px }
  .crew-card .mistake-item { margin:3px 0; color:var(--muted) }
  .none { color:var(--faint); font-size:12.5px }
  .grade { display:inline-grid; place-items:center; min-width:22px; height:22px; padding:0 4px; font:400 20px/1 var(--disp); border:1px solid currentColor; color:var(--muted); text-shadow:inherit }
  .grade.gA, .grade.gB { color:var(--ok) } .grade.gC { color:var(--accent) } .grade.gD { color:var(--warn) } .grade.gE, .grade.gF { color:var(--bad) }
  .grade.solid.gA, .grade.solid.gB { background:var(--ok); border-color:var(--ok); color:var(--on); text-shadow:none }
  .grade.solid.gC { background:var(--accent); border-color:var(--accent); color:var(--on); text-shadow:none }
  .grade.solid.gD { background:var(--warn); border-color:var(--warn); color:var(--on); text-shadow:none }
  .grade.solid.gE, .grade.solid.gF { background:var(--bad); border-color:var(--bad); color:var(--on); text-shadow:none }
  @media (max-width: 860px) { header.top { height:auto; flex-wrap:wrap; padding:10px 16px; gap:10px 14px } main { grid-template-columns:1fr } aside { position:static; height:auto; max-height:46vh; border-right:0; border-bottom:1px solid var(--line2) } #view { padding:20px 16px 80px } }
  main.single { display:block }
  #view { max-width:1600px; margin:0 auto }
  .logo-text { font:400 30px/1 var(--disp); letter-spacing:.12em; color:var(--fg); text-shadow:var(--glow); white-space:nowrap; padding-right:14px; border-right:1px solid var(--line2) }
  .brand { gap:14px }

  /* ---- Shared shell (same block on every page): header, in-page tabs, pager ---- */
  [hidden] { display:none !important }
  header.top .brand h1 { font-size:24px }
  @media (min-width: 861px) {
    header.top { height:56px; gap:18px; flex-wrap:nowrap; row-gap:0 }
    aside { top:56px; height:calc(100vh - 56px) }
  }
  @media (max-width: 1180px) { header.top .brand h1 { display:none } }
  .subbar { position:sticky; top:56px; z-index:4; display:flex; align-items:stretch; gap:14px; padding:0 20px; min-height:44px; background:var(--bg); border-bottom:1px solid var(--line2) }
  .subbar > :not(.subnav) { align-self:center }
  .subnav { display:flex; overflow-x:auto; scrollbar-width:none }
  .subnav button { flex:none; display:flex; align-items:center; gap:7px; min-height:44px; padding:0 14px; border:0; border-bottom:2px solid transparent; background:none; color:var(--muted); font:500 11.5px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; cursor:pointer; text-shadow:inherit }
  .subnav button:hover { color:var(--fg); background:var(--soft) }
  .subnav button.on { color:var(--fg); border-bottom-color:var(--fg); font-weight:600 }
  .subnav .n { font-size:11px; color:var(--faint); font-weight:500 }
  .subnav button.on .n { color:var(--fg) }
  .pager { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-variant-numeric:tabular-nums }
  .pager:empty { display:none }
  .pager .gap { display:grid; place-items:center; padding:0 8px; color:var(--faint); border-right:1px solid var(--line2) }
  .seg button:disabled { opacity:.35; cursor:default; background:none }
  @media (max-width: 860px) { .subbar { position:static; padding:0 16px; flex-wrap:wrap } }
  .bar { height:8px; border:1px solid var(--line2); padding:1px; background:none; overflow:hidden }
  .bar i { display:block; height:100%; background:repeating-linear-gradient(90deg, var(--ok) 0 5px, transparent 5px 7px) }
  /* Crew: performance-style summary strip + leaderboard rows (click a row for detail) */
  #view { padding:18px 24px 64px }
  .summary { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:22px; align-items:center; padding:12px 18px; margin:0 0 22px }
  .summary .big { display:flex; align-items:center; gap:16px }
  .summary .big .grade.lg { min-width:56px; height:48px; font-size:40px }
  .summary .k, .kv .k { font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--faint) }
  .summary .big .v, .kv .v { font:400 26px/1 var(--disp); font-variant-numeric:tabular-nums; margin-top:2px }
  .summary .s, .kv .s { font-size:11.5px; color:var(--muted) }
  .summary .mid { display:flex; flex-direction:column; gap:8px; min-width:0 } .summary .mid .bar { height:14px }
  .summary .stats2 { display:flex; gap:22px; padding-left:22px; border-left:1px solid var(--line2) }
  section.sec { margin-bottom:24px }
  .sec > h3 { margin:0 0 8px; font-size:20px }
  .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:0 0 8px }
  .toolbar input { width:min(280px, 100%) }
  .sortl { display:flex; align-items:center; gap:8px; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted) }
  .sortl select { text-transform:none; letter-spacing:0; min-width:180px }
  .cnt { margin-left:auto; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-variant-numeric:tabular-nums }
  .board { background:var(--panel); border:1px solid var(--line2) }
  .bhead, .crew-card { display:grid; grid-template-columns:36px minmax(150px,1.1fr) 80px minmax(140px,1fr) 64px minmax(200px,1.3fr) 130px; gap:0 14px; align-items:center; padding:0 18px 0 16px }
  .bhead { padding-top:7px; padding-bottom:7px; border-bottom:1px solid var(--line2); font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--faint) }
  .bhead > :nth-child(3), .bhead > :nth-child(5), .bhead > :nth-child(7) { text-align:right }
  .crew-card { grid-template-areas:"g n s f r m l" "g o s f r m l" ". d d d d d d" ". e e e e e e"; position:static; background:none; border:0; border-bottom:1px solid var(--line); border-left:2px solid transparent; padding-top:6px; padding-bottom:6px; cursor:pointer }
  .crew-card::before, .crew-card::after { display:none }
  .crew-card:last-of-type { border-bottom:0 }
  .crew-card:hover { background:var(--soft) }
  .crew-card.open { background:var(--soft); border-left-color:var(--fg) }
  .crew-card .name { grid-area:n; font:400 18px/1 var(--disp); letter-spacing:.06em; text-transform:uppercase; margin:0; align-self:end }
  .crew-card .role { grid-area:o; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:2px 0 0; align-self:start }
  .crew-card .row { display:flex; flex-direction:column; gap:2px; margin:0; font-size:12.5px; min-width:0 }
  .crew-card .row > b, .crew-card .mistakes-row > b { display:none }
  .crew-card .k-steps { grid-area:s; text-align:right } .crew-card .k-rerev { grid-area:r; text-align:right }
  .crew-card .k-steps span, .crew-card .k-rerev span { font-variant-numeric:tabular-nums; color:var(--fg) }
  .crew-card .k-fpass { grid-area:f } .crew-card .k-fpass span { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums } .crew-card .k-fpass .bar { height:6px; margin-top:2px }
  .crew-card .k-grade { grid-area:g } .crew-card .k-grade span { font-size:0 } .crew-card .k-grade .grade { min-width:30px; height:30px; font-size:28px }
  .crew-card .k-last { grid-area:l; text-align:right } .crew-card .k-last span { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums }
  .crew-card .mistakes-row { grid-area:m; display:flex; flex-wrap:wrap; gap:4px; margin:0 }
  .crew-card .mistake-badge { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:2px 6px; border:0; color:var(--on); background:var(--faint); text-shadow:none; display:inline-flex; gap:4px }
  .crew-card .mistake-badge b { color:inherit }
  .crew-card .mistake-badge.sev-high { background:var(--bad) } .crew-card .mistake-badge.sev-med { background:var(--warn) }
  .crew-card .mistake-badge.zero { background:none; color:var(--faint); border:1px solid var(--line) }
  .crew-card .mistake-list { grid-area:d; margin:10px 0 4px; padding:4px 0 4px 12px; border-left:1px solid var(--line2) }
  .crew-card .mistake-item { margin:0; padding:3px 0; color:var(--muted); font-size:12.5px }
  .crew-card .k-sr { grid-area:e; margin:4px 0 6px } .crew-card .k-sr span { font-size:12px; color:var(--muted) }
  .crew-card:not(.open) .mistake-list, .crew-card:not(.open) .k-sr { display:none }
  @media (max-width: 1200px) {
    .summary { grid-template-columns:auto minmax(0,1fr) } .summary .stats2 { grid-column:1 / -1; padding:14px 0 0; border-left:0; border-top:1px solid var(--line2); flex-wrap:wrap }
    .bhead { display:none }
    .crew-card { grid-template-columns:36px repeat(3, minmax(0,1fr)); grid-template-areas:"g n n l" "g o o o" "g s f r" "g m m m" ". d d d" ". e e e"; gap:6px 14px; padding-top:10px; padding-bottom:10px }
    .crew-card .row > b { display:block; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint) }
    .crew-card .k-steps, .crew-card .k-rerev { text-align:left }
    .crew-card .k-grade > b { display:none }
  }
  @media (max-width: 760px) { .summary { grid-template-columns:1fr } #view { padding:16px 16px 64px } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo-text" aria-label="MU/TH/UR">MU/TH/UR</span><h1>Harness Crew</h1></div>
  <nav class="seg" aria-label="Pages"><a href="/triage">Triage</a><a href="/missions">Missions</a><a href="/performance">Performance</a><a href="/crew" class="on" aria-current="page">Crew</a></nav>
  <span class="spacer"></span>
  <button id="signout" class="signout" hidden title="Forget the API key stored in this browser">Forget key</button>
  <div class="seg sm" id="theme" title="Theme">
    <button data-set="system">Auto</button>
    <button data-set="light">Light</button>
    <button data-set="dark">Dark</button>
  </div>
</header>
<main class="single">
  <section id="view"><div class="empty">Loading…</div></section>
</main>
<script>
(() => {
  const $ = (s, el=document) => el.querySelector(s);

  // API key (docs/plans/NETWORK-DEPLOYMENT-PLAN.md §3.1): asked for when the
  // service answers 401, kept in this browser, sent on every /v1 call.
  const KEY_STORE = 'bishop.apiKey';
  const getKey = () => { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } };
  const setKey = k => { try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch (e) {} paintSignOut(); };
  const paintSignOut = () => { const b = document.getElementById('signout'); if (b) b.hidden = !getKey(); };
  document.getElementById('signout').onclick = () => { setKey(''); location.reload(); };
  paintSignOut();

  const authed = async (path, opts = {}) => {
    const send = () => fetch(path, { ...opts, headers: { ...(opts.headers || {}), ...(getKey() ? { Authorization: 'Bearer ' + getKey() } : {}) } });
    let r = await send();
    if (r.status === 401) {
      const k = prompt('This bishop-memory needs an API key.\nPaste the key you were given (memoryd keys add <name>):');
      if (k && k.trim()) { setKey(k.trim()); r = await send(); }
    }
    return r;
  };

  const api = async path => {
    const r = await authed(path); const text = await r.text(); let json = {}; try { json = text ? JSON.parse(text) : {}; } catch (e) {}
    if (!r.ok) throw new Error(json.error || r.status); return json;
  };

  const root = document.documentElement;
  const paintTheme = () => $('#theme').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.set === root.dataset.theme));
  $('#theme').querySelectorAll('button').forEach(b => b.onclick = () => { root.dataset.theme = b.dataset.set; try { localStorage.setItem('triage.theme', b.dataset.set); } catch (e) {} paintTheme(); });
  paintTheme();

  // labelRow builds a .row whose label is set with textContent; no markup is
  // ever parsed from a string in this page.
  function labelRow(label) {
    const row = document.createElement('div');
    row.className = 'row';
    const b = document.createElement('b');
    b.textContent = label;
    row.appendChild(b);
    return row;
  }

  function crewCard(agent) {
    const card = document.createElement('div');
    card.className = 'crew-card';

    const nameDiv = document.createElement('div');
    nameDiv.className = 'name';
    nameDiv.textContent = agent.agent;
    card.appendChild(nameDiv);

    const roleDiv = document.createElement('div');
    roleDiv.className = 'role';
    roleDiv.textContent = agent.role || '—';
    card.appendChild(roleDiv);

    const stepsDiv = labelRow('Steps run');
    stepsDiv.classList.add('k-steps');
    const stepsSpan = document.createElement('span');
    stepsSpan.textContent = agent.steps_run + ' / ' + agent.steps_total;
    stepsDiv.appendChild(stepsSpan);
    card.appendChild(stepsDiv);

    const fpassDiv = labelRow('First-pass approval');
    fpassDiv.classList.add('k-fpass');
    const fpassSpan = document.createElement('span');
    if (agent.first_pass_rate != null) {
      const pct = (agent.first_pass_rate * 100).toFixed(0);
      fpassSpan.textContent = pct + '% (' + agent.first_pass_approved + ' of ' + agent.reviewed_steps + ')';
    } else {
      fpassSpan.textContent = '—';
    }
    fpassDiv.appendChild(fpassSpan);
    if (agent.first_pass_rate != null) {
      const bar = document.createElement('div'); bar.className = 'bar';
      const fill = document.createElement('i'); fill.style.width = Math.round(agent.first_pass_rate * 100) + '%';
      bar.appendChild(fill); fpassDiv.appendChild(bar);
    }
    card.appendChild(fpassDiv);

    const rerevDiv = labelRow('Re-reviews');
    rerevDiv.classList.add('k-rerev');
    const rerevSpan = document.createElement('span');
    rerevSpan.textContent = String(agent.re_reviews);
    rerevDiv.title = 'Re-reviews of steps this agent wrote (fix rounds when the verdict line records them)';
    rerevDiv.appendChild(rerevSpan);
    card.appendChild(rerevDiv);

    const mistakesRow = document.createElement('div');
    mistakesRow.className = 'mistakes-row';
    const mLabel = document.createElement('b'); mLabel.textContent = 'Mistakes'; mistakesRow.appendChild(mLabel);
    const mk = agent.mistakes || {};
    [['high', mk.high ?? 0], ['med', mk.med ?? 0], ['low', mk.low ?? 0], ['unrated', mk.unrated ?? 0]].forEach(([impact, count]) => {
      const badge = document.createElement('div');
      badge.className = 'mistake-badge sev-' + impact + (count ? '' : ' zero');
      const b = document.createElement('b');
      b.textContent = String(count);
      badge.appendChild(b);
      const span = document.createElement('span');
      span.textContent = impact;
      badge.appendChild(span);
      mistakesRow.appendChild(badge);
    });
    card.appendChild(mistakesRow);

    if (mk.top && mk.top.length > 0) {
      const mistakeList = document.createElement('div');
      mistakeList.className = 'mistake-list';
      mk.top.forEach(m => {
        const item = document.createElement('div');
        item.className = 'mistake-item';
        const link = document.createElement('a');
        link.href = '/missions#' + encodeURIComponent(m.mission_id);
        link.textContent = m.mission_id;
        item.appendChild(link);
        const text = document.createTextNode(' — ' + m.mistake + ' (' + m.impact + ')');
        item.appendChild(text);
        mistakeList.appendChild(item);
      });
      card.appendChild(mistakeList);
    }

    const srDiv = labelRow('Service records');
    srDiv.classList.add('k-sr');
    const srSpan = document.createElement('span');
    const sr = agent.service_records || {};
    srSpan.textContent = 'total ' + (sr.total ?? 0) + ' (self-reported ' + (sr.self_reported ?? 0) + ', bishop-observed ' + (sr.bishop_observed ?? 0) + ')';
    srDiv.appendChild(srSpan);
    card.appendChild(srDiv);

    const gradeDiv = labelRow('Average grade');
    gradeDiv.classList.add('k-grade');
    const gradeSpan = document.createElement('span');
    gradeSpan.title = 'Shared credit: the grade of every graded mission this agent worked on';
    if (agent.avg_grade) {
      const gradeElem = document.createElement('span');
      gradeElem.className = 'grade g' + agent.avg_grade + ' solid';
      gradeElem.textContent = agent.avg_grade;
      gradeSpan.appendChild(gradeElem);
      const text = document.createTextNode(' over ' + agent.graded_missions + ' graded mission' + (agent.graded_missions !== 1 ? 's' : ''));
      gradeSpan.appendChild(text);
    } else {
      gradeSpan.textContent = '—';
    }
    gradeDiv.appendChild(gradeSpan);
    card.appendChild(gradeDiv);

    const lastDiv = labelRow('Last active');
    lastDiv.classList.add('k-last');
    const lastSpan = document.createElement('span');
    lastSpan.textContent = agent.last_active ? agent.last_active : '—';
    lastDiv.appendChild(lastSpan);
    card.appendChild(lastDiv);

    return card;
  }

  // Toolbar, sort and pager are built with DOM calls; this page never parses markup.
  const CREW_PAGE = 20;
  const cstate = { all:[], q:'', sort:'active', page:0 };
  try { cstate.sort = localStorage.getItem('crew.sort') || 'active'; } catch (e) {}
  const mtotal = a => { const m = a.mistakes || {}; return (m.high ?? 0) + (m.med ?? 0) + (m.low ?? 0) + (m.unrated ?? 0); };
  const sorters = {
    active: (a, b) => String(b.last_active || '').localeCompare(String(a.last_active || '')),
    name: (a, b) => String(a.agent).localeCompare(String(b.agent)),
    grade: (a, b) => String(a.avg_grade || 'Z').localeCompare(String(b.avg_grade || 'Z')),
    firstpass: (a, b) => (b.first_pass_rate ?? -1) - (a.first_pass_rate ?? -1),
    steps: (a, b) => (b.steps_run || 0) - (a.steps_run || 0),
    mistakes: (a, b) => mtotal(b) - mtotal(a),
  };
  const el = (tag, cls, text) => { const x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; };

  // Same pager as the other pages: ‹ Prev, first, current ±1, last, Next ›.
  function pagerEl(page, pages, total, size, go) {
    const wrap = el('div', 'pager'); if (pages <= 1) return wrap;
    wrap.appendChild(el('span', '', (page * size + 1) + '–' + Math.min(total, (page + 1) * size) + ' of ' + total));
    const seg = el('div', 'seg sm');
    const btn = (lbl, to, on, off) => { const b = el('button', on ? 'on' : '', lbl); b.disabled = !!off; b.onclick = () => go(to); seg.appendChild(b); };
    btn('‹ Prev', page - 1, false, page === 0);
    let last = -1;
    for (let i = 0; i < pages; i++) if (i === 0 || i === pages - 1 || Math.abs(i - page) <= 1) { if (i - last > 1) seg.appendChild(el('span', 'gap', '…')); btn(String(i + 1), i, i === page); last = i; }
    btn('Next ›', page + 1, false, page >= pages - 1);
    wrap.appendChild(seg); return wrap;
  }

  function render(crew) {
    const view = $('#view');
    if (!crew || crew.length === 0) {
      view.textContent = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No crew activity yet.';
      view.appendChild(empty);
      return;
    }
    cstate.all = crew;
    paintCrew();
  }

  function paintCrew() {
    const view = $('#view');
    view.textContent = '';
    const bar = el('div', 'toolbar');
    const q = el('input'); q.type = 'search'; q.id = 'cq'; q.placeholder = 'Filter by name or role'; q.value = cstate.q;
    q.oninput = () => { cstate.q = q.value; cstate.page = 0; paintCrew(); const n = $('#cq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
    const sel = el('select');
    [['active', 'Last active'], ['name', 'Name'], ['grade', 'Average grade'], ['firstpass', 'First-pass approval'], ['steps', 'Steps run'], ['mistakes', 'Most mistakes']].forEach(([v, l]) => { const o = el('option', '', l); o.value = v; sel.appendChild(o); });
    sel.value = cstate.sort;
    sel.onchange = () => { cstate.sort = sel.value; cstate.page = 0; try { localStorage.setItem('crew.sort', sel.value); } catch (e) {} paintCrew(); };
    const sortLabel = el('label', 'sortl', 'Sort '); sortLabel.appendChild(sel);
    const needle = cstate.q.trim().toLowerCase();
    const rows = cstate.all.filter(a => !needle || (String(a.agent) + ' ' + String(a.role || '')).toLowerCase().includes(needle)).sort(sorters[cstate.sort] || sorters.active);
    bar.append(q, sortLabel, el('span', 'cnt', rows.length + ' of ' + cstate.all.length + ' agents'));
    // Summary strip, same shape as the performance page.
    const sum = (f) => cstate.all.reduce((n, a) => n + (f(a) || 0), 0);
    const approved = sum(a => a.first_pass_approved), reviewed = sum(a => a.reviewed_steps), rate = reviewed ? approved / reviewed : null;
    const summary = el('div', 'card summary');
    const big = el('div', 'big');
    big.appendChild(el('span', 'grade lg solid ' + (rate == null ? '' : rate >= .85 ? 'gA' : rate >= .7 ? 'gB' : rate >= .55 ? 'gC' : 'gD'), rate == null ? '—' : String(Math.round(rate * 100))));
    const bigt = el('div'); bigt.append(el('div', 'k', 'First-pass approval'), el('div', 'v', rate == null ? '—' : Math.round(rate * 100) + '%'), el('div', 's', approved + ' of ' + reviewed + ' reviewed steps'));
    big.appendChild(bigt);
    const mid = el('div', 'mid'); const mbar = el('div', 'bar'); const mfill = el('i'); mfill.style.width = Math.round((rate || 0) * 100) + '%'; mbar.appendChild(mfill); mid.append(el('div', 'k', 'Crew-wide first pass'), mbar);
    const stats = el('div', 'stats2');
    const kv = (k, v, s) => { const x = el('div', 'kv'); x.append(el('div', 'k', k), el('div', 'v', String(v))); if (s) x.appendChild(el('div', 's', s)); return x; };
    stats.append(kv('Agents', cstate.all.length), kv('Steps run', sum(a => a.steps_run)), kv('Re-reviews', sum(a => a.re_reviews)), kv('High-impact mistakes', sum(a => (a.mistakes || {}).high), sum(a => mtotal(a)) + ' recorded in all'));
    summary.append(big, mid, stats);
    view.appendChild(summary);
    const head = el('h3', '', 'Crew '); head.appendChild(el('span', 'n', String(rows.length)));
    const sec = el('section', 'sec'); sec.append(head, bar);
    view.appendChild(sec);
    const pages = Math.max(1, Math.ceil(rows.length / CREW_PAGE)); cstate.page = Math.min(cstate.page, pages - 1);
    const list = document.createElement('div');
    list.className = 'crew-list board';
    const bh = el('div', 'bhead'); ['Avg', 'Agent', 'Steps', 'First pass', 'Re-rev', 'Mistakes', 'Last active'].forEach(t => bh.appendChild(el('span', '', t)));
    if (rows.length) list.appendChild(bh);
    rows.slice(cstate.page * CREW_PAGE, (cstate.page + 1) * CREW_PAGE).forEach(agent => {
      const card = crewCard(agent);
      card.title = 'Click for mistakes and service records';
      card.onclick = e => { if (!e.target.closest('a')) card.classList.toggle('open'); };
      list.appendChild(card);
    });
    if (!rows.length) list.appendChild(el('div', 'none', 'No agents match.'));
    sec.appendChild(list);
    sec.appendChild(pagerEl(cstate.page, pages, rows.length, CREW_PAGE, p => { cstate.page = p; paintCrew(); window.scrollTo(0, 0); }));
  }

  api('/v1/crew')
    .then(data => { render(data.crew); })
    .catch(e => {
      const view = $('#view');
      view.textContent = '';
      const err = document.createElement('div');
      err.className = 'empty';
      err.textContent = 'Cannot reach the service: ' + e.message;
      view.appendChild(err);
    });
})();
</script>
</body>
</html>
