name: CI

# Runs the full local verification gate (see CONTRIBUTING.md) on Linux
# for every push and pull request. No publishing/release job and no
# secrets are used anywhere in this workflow, by design (task-20260821-02
# step 6, Job 5).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: build, vet, fmt, test
    runs-on: ubuntu-latest
    # UPDATE_GOLDEN rewrites a golden file and fails the test on purpose (see
    # the golden test docblocks). CI forces it empty so update mode can never
    # run in CI; the Go and Python tests both read the empty string as unset.
    env:
      UPDATE_GOLDEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go-version-file (rather than a hardcoded version string)
          # keeps CI pinned to exactly the Go version go.mod declares
          # ("go 1.25.5"), so a go.mod bump can't silently drift out of
          # sync with what CI actually runs.
          go-version-file: go.mod
          # actions/setup-go's built-in module cache, keyed on go.sum —
          # no separate actions/cache step needed.
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt (must report no files)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo
            echo "Run 'gofmt -w .' (or 'make fmt') locally and commit the result."
            exit 1
          fi

      - name: go test
        run: go test ./... -count=1

      - name: go test -race
        run: go test -race ./... -count=1

      # The Python suite under scripts/, the same command `make test` runs.
      # It includes the reconciler golden test (scripts/test_reconcile_golden.py),
      # which runs against a local fake service and never the live daemon.
      - name: python unittest (scripts/)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
